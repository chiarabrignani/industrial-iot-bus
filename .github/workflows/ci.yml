name: CI/CD

on:
  push:
    branches: [ master ]
  pull_request:
    branches: [ master ]

jobs:

  test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Configura Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.9"

      - name: Installa dipendenze
        run: |
          python -m pip install --upgrade pip
          pip install pytest pytest-cov psycopg2-binary

      - name: Verifica sintassi Python
        run: |
          python -m py_compile flink/jobs/alert_logic.py
          python -m py_compile flink/jobs/telemetry_job.py
          python -m py_compile simulator/bus_simulator.py
          python -m py_compile bridge/bridge.py

      - name: Esegui test unitari e coverage
        run: |
          pytest --cov=alert_logic \
                 --cov=telemetry_job \
                 --cov-report=term-missing \
                 -q tests/test_alert_logic.py tests/test_telemetry_job.py

  docker:
    runs-on: ubuntu-latest
    needs: test

    steps:
      - name: Checkout del repository
        uses: actions/checkout@v4

      - name: Verifica configurazione Docker Compose
        run: docker compose config -q

      - name: Build delle immagini Docker
        run: docker compose build

      - name: Crea artefatto di deployment
        uses: actions/upload-artifact@v4
        with:
          name: deployment-bundle
          path: |
            docker-compose.yml
            bridge/
            flink/
            simulator/
            mqtt/
            postgres/
